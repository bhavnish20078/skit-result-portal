<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKIT Result Viewer - Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================================= -->
<!-- LOGIN PAGE                                     -->
<!-- This is the very first page a student sees.    -->
<!-- The form below submits data to login.php using -->
<!-- the POST method, where it is checked against   -->
<!-- the MySQL database.                            -->
<!-- ============================================= -->

<div class="login-page">
  <div class="login-card">

    <!-- Branding / header section -->
    <div class="login-header">
      <div class="logo-circle">SKIT</div>
      <h1>SKIT Result Viewer</h1>
      <p class="subtitle">Student Academic Result Portal</p>
      <p class="college-name">Swami Keshvanand Institute of Technology, Management &amp; Gramothan</p>
    </div>

    <!--
      If login.php redirects back here with an error,
      it will append ?error=... to the URL.
      script.js reads this and shows a message box below.
    -->
    <div id="errorBox" class="error-box" style="display:none;"></div>

    <!-- The actual login form -->
    <form id="loginForm" action="login.php" method="POST" novalidate>

      <div class="form-group">
        <label for="enrollment_no">Enrollment Number</label>
        <input
          type="text"
          id="enrollment_no"
          name="enrollment_no"
          placeholder="e.g. 21EASKIT001"
          autocomplete="username"
          required>
        <span class="field-error" id="enrollmentError"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>
          <!-- Show/Hide password toggle button, handled in script.js -->
          <button type="button" id="togglePassword" class="toggle-btn">Show</button>
        </div>
        <span class="field-error" id="passwordError"></span>
      </div>

      <button type="submit" class="btn-primary">Login</button>
    </form>

    <p class="hint-text">
      Sample login: Enrollment <strong>21EASKIT001</strong>,
      Password <strong>skit@123</strong>
    </p>

    <p class="hint-text"><a href="admin_login.html">Admin Login &rarr;</a></p>
  </div>
</div>

<footer class="login-footer">
  &copy; 2026 SKIT Result Viewer &mdash; A student academic project
</footer>

<script src="script.js"></script>
</body>
</html>
